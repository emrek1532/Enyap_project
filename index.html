<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Enyap Isı - Teklif &amp; Sipariş Takibi</title>
    <meta name="description" content="Isparta saha satış ve İstanbul merkez ofis için teklif, sipariş, sevkiyat takibi ve uçtan uca şifreli ortak takvim sistemi." />
    <meta property="og:title" content="Enyap Isı - Saha ve Ofis Takip Portalı" />
    <meta property="og:description" content="Isparta saha satış ve İstanbul merkez ofis için teklif, sipariş, sevkiyat takibi ve uçtan uca şifreli ortak takvim sistemi." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#006ec6" />
    <link rel="manifest" href="/manifest.webmanifest?v=6" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Enyap Isı" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
      <!-- Açılış ekranı: uygulama yüklenene kadar görünür, React açılınca kaybolur. Kurumsal renkler: mavi #006EC6, yeşil #00B293 -->
      <style>
        #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
          background:radial-gradient(90% 60% at 50% 115%,rgba(0,178,147,.55) 0%,rgba(0,178,147,0) 70%),linear-gradient(180deg,#006ec6 0%,#0465b6 100%);
          font-family:'Plus Jakarta Sans',system-ui,sans-serif}
        #splash img{width:min(66vw,320px);height:auto;animation:sp-in .7s ease-out both}
        #splash .sp-tag{font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85);animation:sp-in .7s .15s ease-out both}
        #splash .sp-bar{width:min(46vw,200px);height:4px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;animation:sp-in .7s .3s ease-out both}
        #splash .sp-bar i{display:block;width:40%;height:100%;border-radius:99px;background:linear-gradient(90deg,#7fe6cf,#fff);animation:sp-run 1.2s ease-in-out infinite}
        @keyframes sp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
        @keyframes sp-run{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
        @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .sp-bar i{width:100%}}
      </style>
      <div id="splash">
        <img src="/logo-white.png" alt="ENYAP" />
        <div class="sp-tag">Isı Sistemleri</div>
        <div class="sp-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
